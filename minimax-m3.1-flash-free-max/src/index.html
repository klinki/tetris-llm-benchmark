<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tetris</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230b0e14'/><rect x='2' y='2' width='5' height='5' fill='%23a85ad7'/><rect x='9' y='2' width='5' height='5' fill='%2331c7ef'/><rect x='2' y='9' width='5' height='5' fill='%23ff8f27'/><rect x='9' y='9' width='5' height='5' fill='%234cdb38'/></svg>"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game">
      <canvas id="board" aria-label="Playfield"></canvas>
      <canvas id="panel" aria-label="Score and next pieces"></canvas>
    </main>

    <section class="controls">
      <h1>Tetris</h1>
      <ul>
        <li><kbd>&larr;</kbd> <kbd>&rarr;</kbd> move</li>
        <li><kbd>&uarr;</kbd> or <kbd>X</kbd> rotate clockwise</li>
        <li><kbd>Z</kbd> or <kbd>Ctrl</kbd> rotate anti clockwise</li>
        <li><kbd>&darr;</kbd> soft drop</li>
        <li><kbd>Space</kbd> drop to position</li>
        <li><kbd>C</kbd> hold piece</li>
        <li><kbd>R</kbd> restart</li>
        <li><kbd>P</kbd> pause</li>
      </ul>
    </section>

    <script type="module" src="main.js"></script>
  </body>
</html>
