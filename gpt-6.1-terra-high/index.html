<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Tetris</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><header class="header"><div><p class="eyebrow">THE CLASSIC BLOCK GAME</p><h1>TETRIS<span>.</span></h1></div><button id="restart" class="restart" aria-label="Start a new game">↻ <span>New game</span></button></header>
<div class="game-layout"><aside class="left"><section class="panel hold-panel"><div class="panel-title">HOLD <span>C</span></div><canvas id="hold" width="120" height="90" aria-label="Held piece"></canvas></section><section class="panel stats"><div><span>SCORE</span><strong id="score">0</strong></div><div><span>LEVEL</span><strong id="level">01</strong></div><div><span>LINES</span><strong id="lines">00</strong></div></section></aside>
<section class="board-wrap" aria-label="Tetris game board"><canvas id="board" width="300" height="600"></canvas><div id="overlay" class="overlay" hidden><div class="overlay-content"><p class="eyebrow">NICE RUN</p><h2>GAME OVER</h2><p>The stack reached the top.</p><button id="play-again">Play again <span>↵</span></button><small>or press R</small></div></div></section>
<aside class="right"><section class="panel next-panel"><div class="panel-title">NEXT <span>01—05</span></div><canvas id="next" width="120" height="360" aria-label="Next pieces"></canvas></section></aside></div>
<footer><div class="controls-title">HOW TO PLAY <span> / </span> <span>KEYBOARD CONTROLS</span></div><div class="controls"><div><kbd>←</kbd><kbd>→</kbd><span>Move</span></div><div><kbd>↑</kbd><kbd>X</kbd><span>Rotate</span></div><div><kbd>Z</kbd><span>Rotate back</span></div><div><kbd>↓</kbd><span>Soft drop</span></div><div><kbd class="wide">SPACE</kbd><span>Hard drop</span></div><div><kbd>C</kbd><span>Hold</span></div></div><p class="footer-note">STACK SMART. PLAY FOREVER. <span>✦</span></p></footer></main><script type="module" src="dist/main.js"></script></body></html>
