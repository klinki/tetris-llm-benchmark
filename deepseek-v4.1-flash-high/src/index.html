<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tetris</title>
    <meta
      name="description"
      content="Browser-based Tetris following the Tetris Guideline."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23070a14'/%3E%3Crect x='3' y='3' width='4' height='4' fill='%232ee6f6'/%3E%3Crect x='7' y='3' width='4' height='4' fill='%23b45cff'/%3E%3Crect x='3' y='7' width='4' height='4' fill='%2345e06f'/%3E%3Crect x='7' y='7' width='4' height='4' fill='%23ff4d6d'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1>TETRIS</h1>
        <p>Guideline rules &middot; 7-bag &middot; SRS</p>
      </header>

      <main class="game">
        <aside class="panel">
          <section class="box">
            <h2>Hold</h2>
            <canvas id="hold" aria-label="Hold piece"></canvas>
          </section>
          <section class="box stats">
            <div><span>Score</span><strong id="score">0</strong></div>
            <div><span>Level</span><strong id="level">1</strong></div>
            <div><span>Lines</span><strong id="lines">0</strong></div>
            <div><span>Combo</span><strong id="combo">0</strong></div>
          </section>
        </aside>

        <div class="stage">
          <canvas id="board" aria-label="Tetris playfield"></canvas>
          <div class="overlay" id="overlay">
            <h2>Game Over</h2>
            <p>Final score <strong id="final-score">0</strong></p>
            <p class="hint">Press <kbd>R</kbd> to restart</p>
          </div>
        </div>

        <aside class="panel">
          <section class="box">
            <h2>Next</h2>
            <canvas id="next" aria-label="Next pieces"></canvas>
          </section>
          <section class="box keys">
            <h2>Controls</h2>
            <ul>
              <li><b>&larr; &rarr;</b><span>Move</span></li>
              <li><b>&uarr; / X</b><span>Rotate CW</span></li>
              <li><b>Z / Ctrl</b><span>Rotate CCW</span></li>
              <li><b>&darr;</b><span>Soft drop</span></li>
              <li><b>Space</b><span>Hard drop</span></li>
              <li><b>C</b><span>Hold</span></li>
              <li><b>R</b><span>Restart</span></li>
            </ul>
          </section>
        </aside>
      </main>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
