<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tetris</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background: #0a0d12;
      color: #dfe6f1;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    h1 {
      margin: 24px 0 0;
      font-size: 22px;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 600;
    }
    canvas {
      border-radius: 8px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.55);
    }
    #controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 22px;
      padding: 0 16px 24px;
      max-width: 640px;
      font-size: 13px;
      color: #8a93a5;
    }
    kbd {
      background: #1c2330;
      border: 1px solid #2c3647;
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 1px 6px;
      font-family: inherit;
      color: #dfe6f1;
    }
  </style>
</head>
<body>
  <h1>Tetris</h1>
  <canvas id="game" width="560" height="640"></canvas>
  <div id="controls">
    <span><kbd>&larr;</kbd> <kbd>&rarr;</kbd> move</span>
    <span><kbd>&uarr;</kbd> / <kbd>X</kbd> rotate clockwise</span>
    <span><kbd>Z</kbd> / <kbd>Ctrl</kbd> rotate counter-clockwise</span>
    <span><kbd>&darr;</kbd> soft drop</span>
    <span><kbd>Space</kbd> hard drop</span>
    <span><kbd>C</kbd> hold</span>
    <span><kbd>R</kbd> restart after game over</span>
  </div>
  <script type="module" src="dist/main.js"></script>
</body>
</html>
