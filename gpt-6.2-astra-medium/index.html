<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tetris · Block Club</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="bar"><div class="brand"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>BLOCK CLUB</div><span class="arcade">ARCADE SERIES <b>/</b> 001</span></div></header>
<main><div class="intro"><div class="edition"><span>✦</span> CLASSIC ARCADE</div><h1 aria-label="Tetris"><canvas id="title" width="198" height="34"></canvas></h1><div class="mode"><i></i><span id="status">LIVE GAME</span></div></div>
<div class="console"><aside class="left"><section class="card"><h2><span>↙</span> Hold</h2><div class="preview hold"><canvas id="held" width="104" height="64"></canvas><kbd>C</kbd></div></section>
<section class="card stats"><h2><span>▥</span> Statistics</h2><div class="stat"><label>Score</label><strong id="score">000000</strong></div><div class="stat"><label>Level</label><strong id="level">01</strong></div><div class="stat"><label>Lines</label><strong id="lines">000</strong></div></section></aside>
<div class="machine"><div class="screen"><canvas id="board" width="300" height="600" aria-label="Tetris playfield"></canvas><div id="overlay" hidden><strong></strong><button id="resume">Resume</button></div></div><div class="base"><span><i></i> PLAYFIELD</span><button id="pause" aria-label="Pause game">Ⅱ</button></div></div>
<aside class="right"><section class="card"><h2><span>→</span> Next</h2><div class="preview next" id="next"></div></section><section class="card controls"><h2><span>✥</span> Controls</h2><div class="keys"><p><span>Move</span><b><kbd>←</kbd> <kbd>→</kbd></b></p><p><span>Rotate CW</span><kbd>↑ / X</kbd></p><p><span>Rotate CCW</span><kbd>Z / Ctrl</kbd></p><p><span>Soft drop</span><kbd>↓</kbd></p><p><span>Hard drop</span><kbd>Space</kbd></p><p><span>Hold</span><kbd>C</kbd></p><p><span>Pause</span><kbd>P</kbd></p></div></section></aside></div>
<div class="touch"><button data-key="ArrowLeft">←</button><button data-key="ArrowRight">→</button><button data-key="ArrowUp">Rotate</button><button data-key="KeyC">Hold</button><button data-key="Space">Drop</button></div></main><script type="module" src="dist/app.js"></script></body></html>
