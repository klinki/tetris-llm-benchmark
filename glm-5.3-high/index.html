<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tetris</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="layout">
    <h1>TETRIS</h1>
    <div class="game">
      <div class="board-wrap">
        <canvas id="board" width="300" height="600"></canvas>
        <div id="label" class="label hidden"></div>
        <div id="overlay" class="overlay hidden">
          <strong>GAME OVER</strong>
          <span>press R to restart</span>
        </div>
      </div>
      <aside class="panel">
        <section>
          <h2>Hold <kbd>C</kbd></h2>
          <canvas id="hold" width="120" height="120"></canvas>
        </section>
        <section>
          <h2>Next</h2>
          <canvas id="next" width="120" height="450"></canvas>
        </section>
        <section class="stats">
          <div><h2>Score</h2><span id="score">0</span></div>
          <div><h2>Lines</h2><span id="lines">0</span></div>
          <div><h2>Level</h2><span id="level">1</span></div>
        </section>
        <section class="help">
          <h2>Controls</h2>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> move</li>
            <li><kbd>↑</kbd>/<kbd>X</kbd> rotate CW</li>
            <li><kbd>Z</kbd>/<kbd>Ctrl</kbd> rotate CCW</li>
            <li><kbd>↓</kbd> soft drop</li>
            <li><kbd>Space</kbd> hard drop</li>
            <li><kbd>C</kbd> hold</li>
            <li><kbd>R</kbd> restart</li>
          </ul>
        </section>
      </aside>
    </div>
  </main>
  <script type="module" src="dist/main.js"></script>
</body>
</html>
