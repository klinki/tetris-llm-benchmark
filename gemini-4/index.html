<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TetrisJS — Guideline Edition</title>
    <style>
      :root {
        --bg-primary: #060911;
        --bg-panel: #111827;
        --border-panel: rgba(255, 255, 255, 0.12);
        --text-primary: #f3f4f6;
        --text-muted: #9ca3af;
        --accent-cyan: #00f0f0;
        --accent-purple: #a855f7;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        background: radial-gradient(circle at 50% 15%, #172036 0%, var(--bg-primary) 75%);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
          Ubuntu, Cantarell, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        user-select: none;
      }

      .app-header {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 16px;
      }

      .app-header h1 {
        font-size: 1.9rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        background: linear-gradient(90deg, #00f0f0, #38bdf8, #a855f7, #f0a000);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .app-header .badge {
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--accent-cyan);
        background: rgba(0, 240, 240, 0.1);
        border: 1px solid rgba(0, 240, 240, 0.3);
        padding: 3px 8px;
        border-radius: 999px;
      }

      .game-layout {
        display: grid;
        grid-template-columns: 180px auto 190px;
        gap: 18px;
        align-items: start;
      }

      .column {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .panel {
        background: rgba(17, 24, 39, 0.88);
        border: 1px solid var(--border-panel);
        border-radius: 12px;
        padding: 14px;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
      }

      .panel-title {
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--text-muted);
        margin-bottom: 10px;
      }

      .mini-canvas-wrap {
        display: flex;
        justify-content: center;
        align-items: center;
        background: #0b0f19;
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 8px;
        padding: 6px;
      }

      .stats-grid {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .stat-item {
        display: flex;
        flex-direction: column;
        background: rgba(11, 15, 25, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 8px;
        padding: 8px 12px;
      }

      .stat-label {
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-muted);
      }

      .stat-value {
        font-size: 1.3rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: #ffffff;
        margin-top: 2px;
      }

      .board-wrapper {
        position: relative;
        padding: 10px;
        background: rgba(17, 24, 39, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 14px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
      }

      #board-canvas {
        display: block;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .board-overlay {
        position: absolute;
        inset: 10px;
        background: rgba(6, 9, 17, 0.84);
        backdrop-filter: blur(4px);
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        transition: opacity 0.18s ease;
      }

      .board-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .board-overlay h2 {
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        color: #ffffff;
        margin-bottom: 8px;
      }

      .board-overlay p {
        font-size: 0.92rem;
        color: var(--accent-cyan);
      }

      .action-banner {
        min-height: 48px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        background: rgba(168, 85, 247, 0.12);
        border: 1px solid rgba(168, 85, 247, 0.35);
        border-radius: 10px;
        padding: 8px 10px;
        opacity: 0;
        transform: translateY(4px);
        transition: opacity 0.15s ease, transform 0.15s ease;
      }

      .action-banner.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .action-banner strong {
        font-size: 0.9rem;
        letter-spacing: 0.08em;
        color: #f0abfc;
      }

      .action-banner span {
        font-size: 0.72rem;
        color: #e9d5ff;
        margin-top: 2px;
      }

      .controls-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 7px;
        font-size: 0.78rem;
      }

      .controls-list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--text-muted);
      }

      .key {
        color: var(--text-primary);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 5px;
        padding: 2px 6px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.72rem;
        font-weight: 600;
      }

      .btn-row {
        display: flex;
        gap: 8px;
      }

      button {
        flex: 1;
        background: rgba(255, 255, 255, 0.08);
        color: var(--text-primary);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 0.78rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      button:hover {
        background: rgba(0, 240, 240, 0.16);
        border-color: rgba(0, 240, 240, 0.45);
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <h1>TETRIS</h1>
      <span class="badge">Guideline SRS</span>
    </header>

    <main class="game-layout">
      <!-- Left Column: Hold & Stats -->
      <section class="column">
        <div class="panel">
          <div class="panel-title">Hold (C)</div>
          <div class="mini-canvas-wrap">
            <canvas id="hold-canvas" width="120" height="84"></canvas>
          </div>
        </div>

        <div class="panel stats-grid">
          <div class="stat-item">
            <span class="stat-label">Score</span>
            <span class="stat-value" id="stat-score">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Best</span>
            <span class="stat-value" id="stat-highscore">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Lines</span>
            <span class="stat-value" id="stat-lines">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Level</span>
            <span class="stat-value" id="stat-level">1</span>
          </div>
        </div>

        <div id="action-banner" class="action-banner" aria-live="polite"></div>
      </section>

      <!-- Center Column: 10x20 Playfield -->
      <section class="board-wrapper">
        <canvas id="board-canvas" width="320" height="640"></canvas>
        <div id="board-overlay" class="board-overlay hidden">
          <h2 id="overlay-title">PAUSED</h2>
          <p id="overlay-subtitle">Press P or Esc to resume</p>
        </div>
      </section>

      <!-- Right Column: Next Queue & Controls -->
      <section class="column">
        <div class="panel">
          <div class="panel-title">Next</div>
          <div class="mini-canvas-wrap">
            <canvas id="next-canvas" width="120" height="340"></canvas>
          </div>
        </div>

        <div class="panel">
          <div class="panel-title">Controls</div>
          <ul class="controls-list">
            <li><span>Move</span><span class="key">← / →</span></li>
            <li><span>Rotate CW</span><span class="key">↑ / X</span></li>
            <li><span>Rotate CCW</span><span class="key">Z / Ctrl</span></li>
            <li><span>Soft Drop</span><span class="key">↓</span></li>
            <li><span>Hard Drop</span><span class="key">Space</span></li>
            <li><span>Hold</span><span class="key">C / Shift</span></li>
            <li><span>Pause</span><span class="key">P / Esc</span></li>
            <li><span>Restart</span><span class="key">R</span></li>
          </ul>
        </div>

        <div class="btn-row">
          <button id="btn-pause" type="button">Pause (P)</button>
          <button id="btn-restart" type="button">Restart (R)</button>
        </div>
      </section>
    </main>

    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
