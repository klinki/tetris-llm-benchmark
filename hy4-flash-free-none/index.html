<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TetrisJS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game">
    <div class="side">
      <section class="panel">
        <h2>Hold</h2>
        <canvas id="hold"></canvas>
      </section>
      <section class="panel stats">
        <div><span>Score</span><strong id="score">0</strong></div>
        <div><span>Level</span><strong id="level">1</strong></div>
        <div><span>Lines</span><strong id="lines">0</strong></div>
      </section>
    </div>

    <section class="playfield">
      <canvas id="board"></canvas>
    </section>

    <div class="side">
      <section class="panel">
        <h2>Next</h2>
        <canvas id="next"></canvas>
      </section>
      <section class="panel controls">
        <h2>Controls</h2>
        <ul>
          <li>← → move</li>
          <li>↑ / X rotate CW</li>
          <li>Z / Ctrl rotate CCW</li>
          <li>↓ soft drop</li>
          <li>Space hard drop</li>
          <li>C hold</li>
          <li>R restart</li>
        </ul>
      </section>
    </div>
  </div>
  <script src="dist/main.js"></script>
</body>
</html>
