<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tetris</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #07090d;
      color: #e6edf3;
      font-family: system-ui, -apple-system, sans-serif;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 6px;
      font-weight: 700;
    }
    canvas {
      border: 1px solid #21262d;
      border-radius: 6px;
    }
    .controls {
      max-width: 620px;
      margin: 0;
      font-size: 13px;
      color: #8b949e;
      text-align: center;
      line-height: 1.8;
    }
    kbd {
      background: #1c2128;
      border: 1px solid #30363d;
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 1px 6px;
      font-family: Menlo, Consolas, monospace;
      font-size: 12px;
      color: #e6edf3;
    }
  </style>
</head>
<body>
  <h1>TETRIS</h1>
  <canvas id="game"></canvas>
  <p class="controls">
    <kbd>&larr;</kbd> <kbd>&rarr;</kbd> move &nbsp;·&nbsp;
    <kbd>&uarr;</kbd> / <kbd>x</kbd> rotate CW &nbsp;·&nbsp;
    <kbd>z</kbd> / <kbd>Ctrl</kbd> rotate CCW &nbsp;·&nbsp;
    <kbd>&darr;</kbd> soft drop<br />
    <kbd>space</kbd> hard drop &nbsp;·&nbsp;
    <kbd>c</kbd> hold &nbsp;·&nbsp;
    <kbd>r</kbd> restart after game over
  </p>
  <script type="module" src="dist/main.js"></script>
</body>
</html>
