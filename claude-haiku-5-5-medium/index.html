<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TetrisJS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="layout">
      <aside class="panel">
        <h2>Hold</h2>
        <canvas id="hold" width="120" height="90"></canvas>
        <h2>Controls</h2>
        <ul class="controls">
          <li>←/→ move</li>
          <li>↑ / X rotate CW</li>
          <li>Z / L-Ctrl rotate CCW</li>
          <li>↓ soft drop</li>
          <li>Space hard drop</li>
          <li>C hold</li>
          <li>R restart</li>
        </ul>
      </aside>

      <section class="board-wrap">
        <canvas id="board" width="300" height="600"></canvas>
        <div id="overlay" class="overlay" hidden>
          <p>GAME OVER</p>
          <small>Press R to restart</small>
        </div>
      </section>

      <aside class="panel">
        <h2>Next</h2>
        <canvas id="next" width="120" height="330"></canvas>
        <dl class="stats">
          <dt>Score</dt><dd id="score">0</dd>
          <dt>Level</dt><dd id="level">1</dd>
          <dt>Lines</dt><dd id="lines">0</dd>
        </dl>
      </aside>
    </main>
    <script type="module" src="dist/main.js"></script>
  </body>
</html>
