<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TetrisJS</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #010409;
        color: #c9d1d9;
        font-family: monospace;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      h1 {
        font-size: 20px;
        letter-spacing: 4px;
        margin: 8px 0 0;
        color: #58a6ff;
      }
      canvas {
        display: block;
        border-radius: 8px;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
      }
      footer {
        font-size: 12px;
        color: #8b949e;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <h1>TETRIS</h1>
    <canvas id="game"></canvas>
    <footer>Guideline rules &middot; 7-bag &middot; SRS &middot; ghost &middot; hold &middot; lock delay</footer>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
