<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TetrisJS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="layout">
    <aside class="panel left">
      <h1>TETRIS</h1>
      <section>
        <h2>Hold</h2>
        <canvas id="hold"></canvas>
      </section>
      <section class="stats">
        <div><span>Score</span><strong id="score">0</strong></div>
        <div><span>Level</span><strong id="level">1</strong></div>
        <div><span>Lines</span><strong id="lines">0</strong></div>
      </section>
    </aside>

    <div class="board-wrap">
      <canvas id="board"></canvas>
      <div id="overlay" class="overlay hidden">
        <div class="overlay-card">
          <h2>GAME OVER</h2>
          <p>Press <kbd>R</kbd> to restart</p>
        </div>
      </div>
    </div>

    <aside class="panel right">
      <section>
        <h2>Next</h2>
        <canvas id="next"></canvas>
      </section>
      <section class="controls">
        <h2>Controls</h2>
        <ul>
          <li><kbd>&larr;</kbd><kbd>&rarr;</kbd> move</li>
          <li><kbd>&uarr;</kbd>/<kbd>X</kbd> rotate CW</li>
          <li><kbd>Z</kbd>/<kbd>Ctrl</kbd> rotate CCW</li>
          <li><kbd>&darr;</kbd> soft drop</li>
          <li><kbd>Space</kbd> hard drop</li>
          <li><kbd>C</kbd> hold</li>
          <li><kbd>R</kbd> restart</li>
        </ul>
      </section>
    </aside>
  </main>
  <script type="module" src="dist/main.js"></script>
</body>
</html>
