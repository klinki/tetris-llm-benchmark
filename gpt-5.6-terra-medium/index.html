<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>TetrisJS</title><link rel="stylesheet" href="style.css" /></head>
  <body>
    <main class="game-shell">
      <section class="side-panel">
        <h1>TETRIS<span>JS</span></h1>
        <div class="stat"><small>SCORE</small><strong id="score">0</strong></div>
        <div class="stat"><small>LEVEL</small><strong id="level">1</strong></div>
        <div class="stat"><small>LINES</small><strong id="lines">0</strong></div>
        <div class="piece-box"><small>HOLD <kbd>C</kbd></small><canvas id="hold" width="100" height="80"></canvas></div>
      </section>
      <section class="board-wrap"><canvas id="board" width="300" height="600" aria-label="Tetris game board"></canvas><div id="message" class="message hidden"></div></section>
      <section class="side-panel next"><div class="piece-box"><small>NEXT</small><canvas id="next" width="120" height="300"></canvas></div><div class="controls"><small>CONTROLS</small><p>← → Move<br>↑ / X Rotate<br>Z Rotate back<br>↓ Soft drop<br>Space Hard drop</p></div></section>
    </main>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
