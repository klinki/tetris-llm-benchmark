<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tetris</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="game">
      <div class="playfield">
        <canvas id="board" aria-label="Playfield"></canvas>
        <div id="overlay" class="overlay" hidden>
          <p class="overlay-title">Game over</p>
          <p>Press R to restart</p>
        </div>
      </div>

      <aside class="sidebar">
        <section class="panel">
          <h2>Hold</h2>
          <canvas id="hold" aria-label="Held piece"></canvas>
        </section>

        <section class="panel">
          <h2>Next</h2>
          <canvas id="next" aria-label="Next pieces"></canvas>
        </section>

        <dl class="stats">
          <dt>Score</dt>
          <dd id="score">0</dd>
          <dt>Level</dt>
          <dd id="level">1</dd>
          <dt>Lines</dt>
          <dd id="lines">0</dd>
        </dl>

        <section class="panel">
          <h2>Controls</h2>
          <ul class="controls">
            <li><kbd>←</kbd> <kbd>→</kbd> move</li>
            <li><kbd>↑</kbd> / <kbd>X</kbd> rotate clockwise</li>
            <li><kbd>Z</kbd> / <kbd>L Ctrl</kbd> rotate anti-clockwise</li>
            <li><kbd>↓</kbd> soft drop</li>
            <li><kbd>Space</kbd> hard drop</li>
            <li><kbd>C</kbd> hold</li>
            <li><kbd>R</kbd> restart after game over</li>
          </ul>
        </section>
      </aside>
    </main>

    <script type="module" src="/dist/main.js"></script>
  </body>
</html>
