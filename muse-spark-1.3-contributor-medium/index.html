<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TetrisJS</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0d1017; color: #e8ecf3; margin: 0; display: flex; justify-content: center; }
  #app { display: flex; gap: 16px; padding: 20px; align-items: flex-start; }
  .panel { background: #161b26; border-radius: 8px; padding: 12px; min-width: 120px; }
  .panel h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; color: #9aa4b8; }
  canvas { display: block; background: #11141c; border-radius: 4px; }
  #stats div { margin: 4px 0; font-size: 14px; }
  #stats span { font-weight: bold; }
  kbd { background: #262d3f; border-radius: 4px; padding: 1px 6px; font-size: 12px; }
  #help { max-width: 200px; font-size: 13px; line-height: 1.7; }
</style>
</head>
<body>
<div id="app">
  <div class="panel">
    <h3>Hold (C)</h3>
    <canvas id="hold"></canvas>
    <div id="stats" style="margin-top:12px">
      <div>Score: <span id="score">0</span></div>
      <div>Level: <span id="level">1</span></div>
      <div>Lines: <span id="lines">0</span></div>
    </div>
  </div>
  <div class="panel">
    <canvas id="board"></canvas>
  </div>
  <div class="panel">
    <h3>Next</h3>
    <canvas id="next"></canvas>
    <div id="help" style="margin-top:12px">
      <div><kbd>←</kbd><kbd>→</kbd> move</div>
      <div><kbd>↑</kbd>/<kbd>X</kbd> rotate CW</div>
      <div><kbd>Z</kbd>/<kbd>Ctrl</kbd> rotate CCW</div>
      <div><kbd>↓</kbd> soft drop</div>
      <div><kbd>Space</kbd> hard drop</div>
      <div><kbd>C</kbd> hold</div>
      <div><kbd>R</kbd> restart</div>
    </div>
  </div>
</div>
<script type="module" src="./dist/main.js"></script>
</body>
</html>
