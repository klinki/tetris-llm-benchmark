<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <style>
    body { margin: 0; background: #111; color: #eee; font-family: sans-serif; display: flex; justify-content: center; align-items: flex-start; gap: 20px; padding: 20px; }
    canvas { border: 2px solid #444; background: #000; }
    .panel { width: 160px; }
    .panel h3 { margin: 8px 0; }
  </style>
</head>
<body>
  <div class="panel">
    <h3>Hold</h3>
    <canvas id="hold" width="120" height="120"></canvas>
    <h3>Score</h3>
    <div id="score">0</div>
    <h3>Lines</h3>
    <div id="lines">0</div>
    <h3>Level</h3>
    <div id="level">0</div>
  </div>
  <canvas id="board" width="200" height="400"></canvas>
  <div class="panel">
    <h3>Next</h3>
    <canvas id="next" width="120" height="360"></canvas>
    <p>←→ move, ↑/X rotate, Z rotate CCW, ↓ soft drop, Space hard drop, C hold, R restart</p>
  </div>
  <script type="module" src="/dist/main.js"></script>
</body>
</html>
