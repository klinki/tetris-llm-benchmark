<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TetrisJS</title><link rel="stylesheet" href="style.css"></head><body><main><h1>TETRIS</h1><section><canvas id="game" width="300" height="600"></canvas><aside><div class="card"><b>SCORE</b><strong id="score">0</strong><b>LINES</b><strong id="lines">0</strong><b>LEVEL</b><strong id="level">0</strong></div><div class="card"><b>HOLD</b><canvas id="hold" width="120" height="90"></canvas><b>NEXT</b><canvas id="next" width="120" height="180"></canvas></div></aside></section><p>← → move · ↑/X rotate · Z/Ctrl reverse · ↓ soft drop · Space hard drop · C hold · R restart</p></main><script type="module" src="dist/main.js"></script></body></html>
