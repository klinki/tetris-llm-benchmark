<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tetris</title><link rel="stylesheet" href="styles.css"></head>
<body><main><header><p class="eyebrow">CLASSIC ARCADE</p><h1>TETRIS</h1><p class="subtitle">Stack smart. Clear lines. Keep moving.</p></header><section class="game-shell"><aside class="side left"><div class="panel"><h2>HOLD <kbd>C</kbd></h2><div id="hold" class="piece-slot"></div></div><div class="panel controls"><h2>CONTROLS</h2><p><kbd>←</kbd><kbd>→</kbd> Move</p><p><kbd>↑</kbd> / <kbd>X</kbd> Rotate</p><p><kbd>Z</kbd> Rotate back</p><p><kbd>↓</kbd> Soft drop</p><p><kbd>SPACE</kbd> Hard drop</p></div></aside><div class="playfield"><div id="board" aria-label="Tetris board"></div><div id="overlay"><strong>GAME OVER</strong><span>Press <kbd>R</kbd> to play again</span></div></div><aside class="side right"><div class="panel stats"><div><span>SCORE</span><strong id="score">0</strong></div><div><span>LINES</span><strong id="lines">0</strong></div><div><span>LEVEL</span><strong id="level">1</strong></div></div><div class="panel"><h2>NEXT</h2><div id="next" class="next-list"></div></div></aside></section><footer>GUIDELINE RULES · 7-BAG · SRS · GHOST · HOLD</footer></main><script type="module" src="main.js"></script></body></html>
