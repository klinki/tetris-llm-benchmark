<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TetrisJS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game">
      <aside class="panel">
        <section>
          <h2>Hold</h2>
          <canvas id="hold"></canvas>
        </section>
        <section class="stats">
          <h2>Score</h2>
          <p id="score">0</p>
          <h2>Level</h2>
          <p id="level">1</p>
          <h2>Lines</h2>
          <p id="lines">0</p>
        </section>
        <p id="message" class="message" aria-live="polite"></p>
      </aside>

      <div class="playfield">
        <canvas id="board"></canvas>
        <div id="overlay" class="overlay" hidden></div>
      </div>

      <aside class="panel">
        <section>
          <h2>Next</h2>
          <canvas id="next"></canvas>
        </section>
        <section class="controls">
          <h2>Controls</h2>
          <dl>
            <dt>← →</dt><dd>Move</dd>
            <dt>↑ / X</dt><dd>Rotate clockwise</dd>
            <dt>Z / Ctrl</dt><dd>Rotate anticlockwise</dd>
            <dt>↓</dt><dd>Soft drop</dd>
            <dt>Space</dt><dd>Hard drop</dd>
            <dt>C</dt><dd>Hold</dd>
            <dt>Esc / P</dt><dd>Pause</dd>
            <dt>R</dt><dd>Restart after game over</dd>
          </dl>
        </section>
      </aside>
    </main>
    <script type="module" src="dist/main.js"></script>
  </body>
</html>
