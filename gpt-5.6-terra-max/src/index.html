<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A dependency-free Guideline Tetris implementation with SRS, hold, ghost piece, and 7-bag randomizer."
    />
    <title>Tetris — Guideline Edition</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <main class="game-shell">
      <header class="masthead">
        <div>
          <p class="eyebrow">GUIDELINE SYSTEM // 01</p>
          <h1>TETRIS<span>DX</span></h1>
        </div>
        <button class="new-game" id="newGame" type="button">New game <span>↻</span></button>
      </header>

      <section class="game-layout" aria-label="Tetris game">
        <aside class="side-column left-column">
          <section class="panel hold-panel">
            <div class="panel-heading">
              <span>Hold</span>
              <kbd>C</kbd>
            </div>
            <canvas id="holdCanvas" width="164" height="112" aria-label="Held Tetris piece"></canvas>
            <p class="hold-state" id="holdState">AVAILABLE</p>
          </section>

          <section class="panel controls-panel">
            <div class="panel-heading">
              <span>Controls</span>
              <span class="signal">LIVE</span>
            </div>
            <dl class="controls-list">
              <div><dt><kbd>←</kbd><kbd>→</kbd></dt><dd>Move</dd></div>
              <div><dt><kbd>↑</kbd><kbd>X</kbd></dt><dd>Rotate right</dd></div>
              <div><dt><kbd>Z</kbd><kbd>Ctrl</kbd></dt><dd>Rotate left</dd></div>
              <div><dt><kbd>↓</kbd></dt><dd>Soft drop</dd></div>
              <div><dt><kbd>Space</kbd></dt><dd>Hard drop</dd></div>
            </dl>
          </section>
        </aside>

        <section class="play-column">
          <div class="field-caption">
            <span class="pulse-dot"></span>
            <span id="statusText">READY</span>
          </div>
          <div class="board-frame">
            <canvas
              id="boardCanvas"
              width="320"
              height="640"
              aria-label="Tetris playfield"
              role="img"
            ></canvas>
            <div class="game-over" id="gameOver" aria-live="assertive">
              <p>GAME OVER</p>
              <span>Press <kbd>R</kbd> to restart</span>
            </div>
          </div>
          <div class="mobile-controls" aria-label="Touch controls">
            <button data-command="hold" type="button" aria-label="Hold piece">Hold</button>
            <button data-command="rotateCounterClockwise" type="button" aria-label="Rotate counterclockwise">↶</button>
            <button data-command="left" type="button" aria-label="Move left">←</button>
            <button data-command="softDrop" type="button" aria-label="Soft drop">↓</button>
            <button data-command="right" type="button" aria-label="Move right">→</button>
            <button data-command="rotateClockwise" type="button" aria-label="Rotate clockwise">↷</button>
            <button class="drop-button" data-command="hardDrop" type="button" aria-label="Hard drop">Drop</button>
          </div>
        </section>

        <aside class="side-column right-column">
          <section class="score-panel">
            <div class="metric">
              <span>Score</span>
              <strong id="scoreValue">000000</strong>
            </div>
            <div class="metric-row">
              <div class="metric compact">
                <span>Level</span>
                <strong id="levelValue">01</strong>
              </div>
              <div class="metric compact">
                <span>Lines</span>
                <strong id="linesValue">000</strong>
              </div>
            </div>
          </section>

          <section class="panel next-panel">
            <div class="panel-heading">
              <span>Next</span>
              <span class="queue-count">05</span>
            </div>
            <canvas id="nextCanvas" width="164" height="388" aria-label="Next five Tetris pieces"></canvas>
          </section>

          <div class="system-note">
            <span>7-BAG</span>
            <span>SRS</span>
            <span>GHOST</span>
          </div>
        </aside>
      </section>

      <footer>
        <span>Use the keyboard or the controls below the board.</span>
        <span id="comboText">COMBO —</span>
      </footer>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
