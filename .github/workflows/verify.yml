name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Benchmark tool tests
        run: python3 -m unittest discover -s tests -v
      - name: Generated report consistency
        run: python3 scripts/benchmark.py verify
      - name: Ranking scores, tables, and links
        run: node .audit/verify-ranking.mjs
