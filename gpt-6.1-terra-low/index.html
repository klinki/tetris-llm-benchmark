<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TetrisJS</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><span class="eyebrow">THE CLASSIC BLOCK GAME</span><h1>TETRIS<span>JS</span></h1></div><p>Make space for a little fun.</p></header><div class="layout"><aside class="left"><section class="panel"><h2>HOLD <small>C</small></h2><canvas id="hold" width="110" height="74"></canvas></section><section class="panel stats"><h2>YOUR GAME</h2><label>SCORE <strong id="score">0</strong></label><label>LEVEL <strong id="level">1</strong></label><label>LINES <strong id="lines">0</strong></label></section></aside><div class="board-wrap"><canvas id="board" width="300" height="600" aria-label="Tetris game board"></canvas><div id="overlay"><div><h2>GAME OVER</h2><p>Nice run. Ready for another?</p><button id="restart">PLAY AGAIN <span>↗</span></button><small>or press R</small></div></div></div><aside class="right"><section class="panel"><h2>NEXT</h2><canvas id="next0" width="110" height="65"></canvas><canvas id="next1" width="110" height="65"></canvas><canvas id="next2" width="110" height="65"></canvas></section><section class="controls"><h2>HOW TO PLAY</h2><div><span>Move</span><kbd>←</kbd> <kbd>→</kbd></div><div><span>Rotate</span><kbd>↑</kbd> <kbd>X</kbd></div><div><span>Rotate back</span><kbd>Z</kbd> <kbd>Ctrl</kbd></div><div><span>Soft drop</span><kbd>↓</kbd></div><div><span>Hard drop</span><kbd>Space</kbd></div><div><span>Hold</span><kbd>C</kbd></div></section></aside></div><footer>STACK SMART. PLAY AGAIN.</footer></main><script src="bundle.js"></script></body></html>
