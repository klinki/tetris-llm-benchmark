<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tetris</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>TETRIS</h1>
      <canvas id="game" width="430" height="560"></canvas>
      <section class="controls">
        <h2>Controls</h2>
        <ul>
          <li><b>&larr;</b> / <b>&rarr;</b> — move left / right</li>
          <li><b>&uarr;</b> or <b>X</b> — rotate clockwise</li>
          <li><b>Z</b> or <b>Ctrl</b> — rotate anti-clockwise</li>
          <li><b>&darr;</b> — soft drop (slower drop down)</li>
          <li><b>Space</b> — hard drop</li>
          <li><b>C</b> — hold piece</li>
          <li><b>R</b> — restart</li>
          <li><b>P</b> — pause</li>
        </ul>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
