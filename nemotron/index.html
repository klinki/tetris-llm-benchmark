<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TetrisJS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    h1 { margin: 0 0 8px 0; font-size: 1.5rem; letter-spacing: 2px; }
    #stage {
      position: relative;
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    canvas {
      display: block;
      background: #000;
      border: 2px solid #333;
      border-radius: 4px;
      image-rendering: pixelated;
    }
    #board { width: 240px; height: 480px; }
    #side {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 170px;
    }
    #hold, #next {
      border: 2px solid #333;
      border-radius: 4px;
      padding: 10px;
      background: #0a0a0a;
    }
    #hold canvas, #next canvas { display: block; margin: 0 auto; background: #000; }
    #hold canvas { width: 100px; height: 100px; }
    #next canvas { width: 120px; height: 240px; }
    .panel-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #aaa;
      margin: 0 0 6px 0;
      text-align: center;
    }
    #stats { font-size: 0.9rem; line-height: 1.6; color: #ddd; }
    #stats b { color: #fff; }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 4px;
    }
    #overlay.visible { display: flex; }
    #overlay h2 { margin: 0 0 12px 0; font-size: 1.75rem; }
    #overlay p { color: #ddd; margin: 0 0 18px 0; }
    button {
      background: #fff;
      color: #111;
      border: none;
      padding: 10px 24px;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #eee; }
    #controls {
      margin-top: 22px;
      font-size: 0.75rem;
      color: #888;
      text-align: center;
      line-height: 1.5;
    }
    #controls kbd {
      background: #222;
      border: 1px solid #444;
      border-radius: 3px;
      padding: 1px 5px;
      color: #fff;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <h1>TETRIS</h1>
  <div id="stage">
    <canvas id="board" width="240" height="480"></canvas>
    <div id="side">
      <div id="hold">
        <p class="panel-title">Hold</p>
        <canvas id="holdCanvas" width="100" height="100"></canvas>
      </div>
      <div id="next">
        <p class="panel-title">Next</p>
        <canvas id="nextCanvas" width="120" height="240"></canvas>
      </div>
      <div id="stats">
        <div>Score <b id="score">0</b></div>
        <div>Level <b id="level">1</b></div>
        <div>Lines <b id="lines">0</b></div>
      </div>
    </div>
    <div id="overlay">
      <h2 id="overlayTitle">GAME OVER</h2>
      <p id="overlayMsg">Final score <b id="finalScore">0</b></p>
      <button id="restartBtn">Restart (R)</button>
    </div>
  </div>
  <div id="controls">
    <kbd>&#8592;</kbd><kbd>&#8594;</kbd> move &nbsp;•&nbsp;
    <kbd>&#8593;</kbd><kbd>X</kbd> rotate CW &nbsp;•&nbsp;
    <kbd>Z</kbd><kbd>Ctrl</kbd> rotate CCW &nbsp;•&nbsp;
    <kbd>&#8595;</kbd> soft drop &nbsp;•&nbsp;
    <kbd>Space</kbd> hard drop &nbsp;•&nbsp;
    <kbd>C</kbd> hold &nbsp;•&nbsp;
    <kbd>R</kbd> restart
  </div>
  <script type="module" src="/dist/main.js"></script>
</body>
</html>
