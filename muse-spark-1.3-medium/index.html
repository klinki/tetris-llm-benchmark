<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TetrisJS — Guideline Edition</title>
<style>
:root { --bg:#070b14; --panel:#131a2c; --line:rgba(255,255,255,.12); --muted:#9aa3b8; --txt:#f2f5fb; }
* { box-sizing:border-box; margin:0; padding:0; }
body { min-height:100vh; background:radial-gradient(circle at 50% 12%, #1a2542 0%, var(--bg) 70%); color:var(--txt); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; user-select:none; }
header { display:flex; align-items:baseline; gap:10px; margin-bottom:14px; }
header h1 { font-size:1.8rem; letter-spacing:.14em; font-weight:800; }
header span { font-size:.72rem; color:#5df2ff; border:1px solid rgba(93,242,255,.4); border-radius:999px; padding:3px 9px; text-transform:uppercase; letter-spacing:.08em; }
.layout { display:grid; grid-template-columns:170px auto 180px; gap:16px; align-items:start; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; box-shadow:0 12px 28px rgba(0,0,0,.45); }
.panel h3 { font-size:.7rem; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); margin-bottom:8px; }
.col { display:flex; flex-direction:column; gap:12px; }
.stat { background:rgba(0,0,0,.3); border:1px solid rgba(255,255,255,.07); border-radius:8px; padding:8px 10px; margin-bottom:8px; }
.stat small { display:block; font-size:.65rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); }
.stat b { font-size:1.25rem; font-variant-numeric:tabular-nums; }
.board-wrap { position:relative; padding:10px; background:var(--panel); border:1px solid rgba(255,255,255,.16); border-radius:14px; }
#board { display:block; border-radius:6px; background:#0b1020; }
#overlay { position:absolute; inset:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(5,8,16,.85); border-radius:6px; transition:opacity .15s; }
#overlay.hidden { opacity:0; pointer-events:none; }
#overlay h2 { font-size:1.8rem; letter-spacing:.1em; }
#overlay p { color:#5df2ff; margin-top:6px; }
#banner { min-height:46px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; border:1px solid rgba(198,81,255,.35); background:rgba(198,81,255,.1); border-radius:10px; padding:8px; opacity:0; transition:opacity .15s; }
#banner.show { opacity:1; }
#banner strong { color:#e3b8ff; font-size:.85rem; letter-spacing:.06em; }
#banner span { color:#d9c7f2; font-size:.72rem; }
.controls { list-style:none; font-size:.78rem; color:var(--muted); display:flex; flex-direction:column; gap:6px; }
.controls li { display:flex; justify-content:space-between; gap:8px; }
kbd { background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.18); border-radius:5px; padding:1px 6px; font-size:.7rem; color:var(--txt); font-family:ui-monospace,monospace; }
.btns { display:flex; gap:8px; }
button { flex:1; background:rgba(255,255,255,.08); color:var(--txt); border:1px solid rgba(255,255,255,.16); border-radius:8px; padding:8px; font-size:.78rem; font-weight:600; cursor:pointer; }
button:hover { background:rgba(93,242,255,.16); }
canvas { max-width:100%; }
</style>
</head>
<body>
<header><h1>TETRIS</h1><span>Guideline SRS</span></header>
<main class="layout">
<section class="col">
<div class="panel"><h3>Hold (C)</h3><canvas id="hold" width="146" height="64"></canvas></div>
<div class="panel">
<div class="stat"><small>Score</small><b id="score">0</b></div>
<div class="stat"><small>Best</small><b id="best">0</b></div>
<div class="stat"><small>Lines</small><b id="lines">0</b></div>
<div class="stat"><small>Level</small><b id="level">1</b></div>
</div>
<div id="banner" aria-live="polite"></div>
</section>
<section class="board-wrap">
<canvas id="board" width="300" height="600"></canvas>
<div id="overlay" class="hidden"><h2 id="overlay-title">PAUSED</h2><p id="overlay-sub">Press P to resume</p></div>
</section>
<section class="col">
<div class="panel"><h3>Next</h3><canvas id="next" width="146" height="340"></canvas></div>
<div class="panel"><h3>Controls</h3>
<ul class="controls">
<li><span>Move</span><span><kbd>←</kbd> <kbd>→</kbd></span></li>
<li><span>Rotate CW</span><span><kbd>↑</kbd>/<kbd>X</kbd></span></li>
<li><span>Rotate CCW</span><span><kbd>Z</kbd>/<kbd>Ctrl</kbd></span></li>
<li><span>Soft drop</span><kbd>↓</kbd></li>
<li><span>Hard drop</span><kbd>Space</kbd></li>
<li><span>Hold</span><kbd>C</kbd></li>
<li><span>Restart</span><kbd>R</kbd></li>
<li><span>Pause</span><kbd>P</kbd></li>
</ul>
</div>
<div class="btns"><button id="btn-pause" type="button">Pause</button><button id="btn-restart" type="button">Restart</button></div>
</section>
</main>
<script type="module" src="./dist/main.js"></script>
</body>
</html>
