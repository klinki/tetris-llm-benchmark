<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TetrisJS</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 50% 0%, #1e293b, #0f172a 70%);
        color: #e2e8f0;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        justify-content: center;
      }
      #app {
        display: flex;
        gap: 24px;
        padding: 24px;
        align-items: flex-start;
      }
      canvas {
        display: block;
        background: #0b1120;
        border: 2px solid #334155;
        border-radius: 6px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }
      .board-wrap {
        position: relative;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(2, 6, 23, 0.82);
        border-radius: 6px;
        text-align: center;
      }
      #overlay h1 {
        margin: 0;
        font-size: 32px;
        color: #f87171;
        letter-spacing: 2px;
      }
      #overlay p {
        margin: 0;
        color: #cbd5e1;
      }
      .panel {
        width: 140px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .box {
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid #334155;
        border-radius: 6px;
        padding: 10px;
      }
      .box h2 {
        margin: 0 0 8px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #94a3b8;
      }
      .stat {
        display: flex;
        justify-content: space-between;
        font-variant-numeric: tabular-nums;
        margin-bottom: 4px;
      }
      .stat span:last-child {
        color: #38bdf8;
        font-weight: 700;
      }
      .controls {
        font-size: 12px;
        line-height: 1.7;
        color: #94a3b8;
      }
      .controls b {
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="board-wrap">
        <canvas id="board"></canvas>
        <div id="overlay">
          <h1>GAME OVER</h1>
          <p>Press <b>R</b> to restart</p>
        </div>
      </div>

      <div class="panel">
        <div class="box">
          <h2>Hold</h2>
          <canvas id="hold"></canvas>
        </div>
        <div class="box">
          <h2>Next</h2>
          <canvas id="next"></canvas>
        </div>
        <div class="box">
          <h2>Stats</h2>
          <div class="stat"><span>Score</span><span id="score">0</span></div>
          <div class="stat"><span>Level</span><span id="level">1</span></div>
          <div class="stat"><span>Lines</span><span id="lines">0</span></div>
        </div>
        <div class="box controls">
          <h2>Controls</h2>
          <div><b>← →</b> move</div>
          <div><b>↑ / X</b> rotate CW</div>
          <div><b>Z / Ctrl</b> rotate CCW</div>
          <div><b>↓</b> soft drop</div>
          <div><b>Space</b> hard drop</div>
          <div><b>C</b> hold</div>
          <div><b>R</b> restart</div>
        </div>
      </div>
    </div>

    <script type="module" src="dist/index.js"></script>
  </body>
</html>
