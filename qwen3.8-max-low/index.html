<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TetrisJS</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a12;
      color: #ddd;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    h1 { font-size: 1.4rem; letter-spacing: 0.3em; margin: 12px 0; color: #9ad; }
    #layout { display: flex; gap: 16px; align-items: flex-start; }
    .panel { width: 140px; display: flex; flex-direction: column; gap: 12px; }
    .box {
      background: #14141f;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 8px;
    }
    .box h3 {
      margin: 0 0 6px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #778;
      text-align: center;
    }
    .stat { display: flex; justify-content: space-between; font-size: 0.9rem; padding: 2px 4px; }
    .stat span:last-child { color: #fff; font-weight: 600; }
    #boardwrap { position: relative; }
    canvas#board {
      display: block;
      border: 2px solid #2a2a3a;
      border-radius: 4px;
      background: #101018;
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(5, 5, 10, 0.75);
      border-radius: 4px;
    }
    #overlay strong { font-size: 1.6rem; color: #f55; letter-spacing: 0.2em; }
    footer { margin: 12px 0; font-size: 0.75rem; color: #667; text-align: center; line-height: 1.6; }
    kbd {
      background: #1c1c2a;
      border: 1px solid #333;
      border-radius: 3px;
      padding: 0 4px;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <h1>TETRIS</h1>
  <div id="layout">
    <div class="panel">
      <div class="box">
        <h3>Hold</h3>
        <canvas id="hold" width="120" height="90"></canvas>
      </div>
      <div class="box">
        <div class="stat"><span>Score</span><span id="score">0</span></div>
        <div class="stat"><span>Level</span><span id="level">1</span></div>
        <div class="stat"><span>Lines</span><span id="lines">0</span></div>
      </div>
    </div>
    <div id="boardwrap">
      <canvas id="board" width="300" height="600"></canvas>
      <div id="overlay">
        <strong>GAME OVER</strong>
        <div>Press <kbd>R</kbd> to restart</div>
      </div>
    </div>
    <div class="panel">
      <div class="box">
        <h3>Next</h3>
        <canvas id="next" width="120" height="300"></canvas>
      </div>
    </div>
  </div>
  <footer>
    <kbd>&larr;</kbd><kbd>&rarr;</kbd> move &nbsp;
    <kbd>&uarr;</kbd>/<kbd>X</kbd> rotate &nbsp;
    <kbd>Z</kbd>/<kbd>Ctrl</kbd> rotate back &nbsp;
    <kbd>&darr;</kbd> soft drop &nbsp;
    <kbd>Space</kbd> hard drop &nbsp;
    <kbd>C</kbd> hold &nbsp;
    <kbd>R</kbd> restart
  </footer>
  <script type="module" src="dist/src/main.js"></script>
</body>
</html>
