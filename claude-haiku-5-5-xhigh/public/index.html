<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TetrisJS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game">
      <aside class="panel">
        <h2>Hold</h2>
        <canvas id="hold" width="120" height="80"></canvas>
        <dl class="stats">
          <dt>Score</dt>
          <dd id="score">0</dd>
          <dt>Level</dt>
          <dd id="level">1</dd>
          <dt>Lines</dt>
          <dd id="lines">0</dd>
        </dl>
        <ul class="controls">
          <li><kbd>←</kbd> <kbd>→</kbd> move</li>
          <li><kbd>↑</kbd> / <kbd>X</kbd> rotate clockwise</li>
          <li><kbd>Z</kbd> / <kbd>Ctrl</kbd> rotate anticlockwise</li>
          <li><kbd>↓</kbd> soft drop</li>
          <li><kbd>Space</kbd> hard drop</li>
          <li><kbd>C</kbd> hold</li>
          <li><kbd>R</kbd> restart after game over</li>
        </ul>
      </aside>

      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <h2>Next</h2>
        <canvas id="next" width="120" height="400"></canvas>
      </aside>
    </main>
    <script type="module" src="/dist/main.js"></script>
  </body>
</html>
