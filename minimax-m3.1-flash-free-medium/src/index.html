<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tetris</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <section class="box">
          <h2>Hold</h2>
          <canvas id="hold" width="104" height="72"></canvas>
        </section>
        <section class="box stats">
          <h2>Stats</h2>
          <dl>
            <dt>Score</dt>
            <dd id="score">0</dd>
            <dt>Lines</dt>
            <dd id="lines">0</dd>
            <dt>Level</dt>
            <dd id="level">1</dd>
            <dt>Combo</dt>
            <dd id="combo">-</dd>
            <dt>Time</dt>
            <dd id="time">0:00</dd>
          </dl>
        </section>
      </aside>

      <main class="board">
        <canvas id="board" width="260" height="520"></canvas>
      </main>

      <aside class="panel">
        <section class="box">
          <h2>Next</h2>
          <canvas id="next" width="104" height="320"></canvas>
        </section>
        <section class="box controls">
          <h2>Controls</h2>
          <ul>
            <li><b>&larr; / &rarr;</b> move</li>
            <li><b>&uarr; / X</b> rotate clockwise</li>
            <li><b>Z / Ctrl</b> rotate counter clockwise</li>
            <li><b>&darr;</b> soft drop</li>
            <li><b>Space</b> hard drop</li>
            <li><b>C</b> hold piece</li>
            <li><b>R</b> restart</li>
            <li><b>P</b> pause</li>
          </ul>
        </section>
      </aside>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
