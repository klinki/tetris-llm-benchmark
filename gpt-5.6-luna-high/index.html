<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TetrisJS</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="masthead">
        <div>
          <p class="eyebrow">TETRISJS</p>
          <h1>Stack with intention.</h1>
        </div>
        <button id="restart-button" class="restart-button" type="button">Restart <span>R</span></button>
      </header>

      <section class="game-layout" aria-label="Tetris game">
        <aside class="side-panel left-panel">
          <section class="card hold-card">
            <h2>Hold <span>C</span></h2>
            <div class="mini-board" id="hold-board" aria-label="Held piece"></div>
          </section>
          <section class="card stats-card">
            <div><span>Score</span><strong id="score">0</strong></div>
            <div><span>Lines</span><strong id="lines">0</strong></div>
            <div><span>Level</span><strong id="level">1</strong></div>
          </section>
        </aside>

        <section class="board-wrap">
          <div id="game-board" class="game-board" role="grid" aria-label="Tetris board"></div>
          <div id="game-message" class="game-message" hidden>
            <p id="message-title">Game over</p>
            <small>Press R to try again</small>
          </div>
        </section>

        <aside class="side-panel right-panel">
          <section class="card next-card">
            <h2>Next</h2>
            <div class="mini-board" id="next-board" aria-label="Next pieces"></div>
          </section>
          <section class="card controls-card">
            <h2>Controls</h2>
            <p><kbd>←</kbd><kbd>→</kbd> Move</p>
            <p><kbd>↑</kbd> / <kbd>X</kbd> Rotate</p>
            <p><kbd>Z</kbd> / <kbd>Ctrl</kbd> Reverse</p>
            <p><kbd>↓</kbd> Soft drop</p>
            <p><kbd>Space</kbd> Hard drop</p>
            <p><kbd>C</kbd> Hold</p>
          </section>
        </aside>
      </section>
      <footer>7-bag randomizer · SRS rotation · ghost piece · lock delay</footer>
    </main>
    <script type="module" src="/dist/src/main.js"></script>
  </body>
</html>
