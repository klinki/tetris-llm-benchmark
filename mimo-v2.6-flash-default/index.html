<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tetris</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #0d0d14;
      color: #e8ecf5;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 10px;
      color: #f0c040;
      text-shadow: 0 0 18px rgba(240, 192, 64, 0.35);
    }
    canvas {
      border-radius: 6px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55);
      background: #14141d;
    }
    .controls {
      margin: 0;
      font-size: 12px;
      color: #8892a8;
      text-align: center;
      line-height: 1.9;
    }
    kbd {
      display: inline-block;
      min-width: 18px;
      padding: 1px 6px;
      margin: 0 1px;
      border: 1px solid #3a4256;
      border-bottom-width: 2px;
      border-radius: 4px;
      background: #1a1a26;
      color: #e8ecf5;
      font: inherit;
    }
  </style>
</head>
<body>
  <h1>TETRIS</h1>
  <canvas id="game" width="480" height="620"></canvas>
  <p class="controls">
    <kbd>&larr;</kbd><kbd>&rarr;</kbd> move &nbsp;
    <kbd>&uarr;</kbd>/<kbd>X</kbd> rotate cw &nbsp;
    <kbd>Z</kbd>/<kbd>Ctrl</kbd> rotate ccw &nbsp;
    <kbd>&darr;</kbd> soft drop<br>
    <kbd>Space</kbd> hard drop &nbsp;
    <kbd>C</kbd> hold &nbsp;
    <kbd>R</kbd> restart after game over
  </p>
  <script type="module" src="./dist/index.js"></script>
</body>
</html>
